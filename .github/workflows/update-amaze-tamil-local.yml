name: Update Combined Tamil TV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "45 0 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: tamil-chain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Refresh, deduplicate and validate
        env:
          SOURCE_URL: "https://tinyurl.com/amaze-tamil-local-tv"
          LOCAL_PLAYLIST: "output/bhoom-tamil.m3u"
          OUTPUT_FILE: "output/tamil-combined.m3u"
          REPORT_FILE: "output/tamil-combined-report.json"
          JSON_OUTPUT_FILE: "output/tamil-combined.json"
          TIMEOUT_SECONDS: "15"
          RETRIES: "3"
          MAX_ENTRIES: "0"
          MAX_CHANNELS: "0"
          MIN_PUBLISHED_CHANNELS: "300"
        run: python3 bhoom-automation/update_external_playlist.py

      - name: Validate combined M3U
        env:
          MIN_PUBLISHED_CHANNELS: "300"
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          m3u = Path("output/tamil-combined.m3u")
          data_file = Path("output/tamil-combined.json")

          text = m3u.read_text(encoding="utf-8", errors="replace")
          data = json.loads(data_file.read_text(encoding="utf-8"))

          entries = [line for line in text.splitlines() if line.startswith("#EXTINF:")]
          urls = [
              line.strip()
              for line in text.splitlines()
              if re.match(r"^(https?|rtmp|rtmps)://", line.strip())
          ]

          if not text.startswith("#EXTM3U"):
              raise SystemExit("Combined M3U is missing #EXTM3U header")

          if any("# X-ALT-STREAM:" in line for line in text.splitlines()):
              raise SystemExit("Combined M3U still contains non-standard X-ALT-STREAM comments")

          if len(entries) != len(urls):
              raise SystemExit(
                  f"Malformed M3U: EXTINF entries={len(entries)} but playable URLs={len(urls)}"
              )

          published_channels = len(data.get("channels", []))
          minimum = int(os.environ.get("MIN_PUBLISHED_CHANNELS", "300"))

          print(f"COMBINED UNIQUE CHANNELS: {published_channels}")
          print(f"COMBINED PLAYABLE ENTRIES: {len(urls)}")
          print(f"MINIMUM REQUIRED CHANNELS: {minimum}")

          if published_channels < minimum:
              raise SystemExit(
                  f"Combined channel safety stop: {published_channels} < {minimum}"
              )

          print("COMBINED M3U FORMAT: PASS")
          print("COMBINED CHANNEL COUNT: PASS")
          PY

      - name: Upload playlist report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamil-combined-playlist-report-${{ github.run_id }}
          path: output/tamil-combined-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Combined playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The Amaze Yourself source can change dynamically. Always publish
          # a fresh combined snapshot, even when channel text is unchanged.
          sed -i '/^# Combined scrape:/d' output/tamil-combined.m3u
          sed -i "2i# Combined scrape: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" output/tamil-combined.m3u
          git add output/tamil-combined.m3u output/tamil-combined-report.json output/tamil-combined.json
          git commit -m "chore: refresh combined Tamil TV playlist"
          # Rebase onto the newest main to avoid a push race with the Bhoom job.
          git fetch origin main
          git rebase origin/main
          git push
