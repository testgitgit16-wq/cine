name: Update Combined Tamil TV playlist

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tamil-chain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Refresh, deduplicate and validate
        env:
          SOURCE_URL: "https://tinyurl.com/amaze-tamil-local-tv"
          LOCAL_PLAYLIST: "output/bhoom-tamil.m3u"
          OUTPUT_FILE: "output/tamil-combined.m3u"
          REPORT_FILE: "output/tamil-combined-report.json"
          JSON_OUTPUT_FILE: "output/tamil-combined.json"
          TIMEOUT_SECONDS: "15"
          RETRIES: "3"
          MAX_ENTRIES: "0"
        run: python3 bhoom-automation/update_external_playlist.py

      - name: Upload playlist report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamil-combined-playlist-report-${{ github.run_id }}
          path: output/tamil-combined-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Combined playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/tamil-combined.m3u output/tamil-combined-report.json output/tamil-combined.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update combined Tamil TV playlist"
          git push || true

      - name: Wait 5 minutes before next Bhoom cycle
        run: sleep 300

      - name: Start Bhoom workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-bhoom-tamil.yml --ref main
