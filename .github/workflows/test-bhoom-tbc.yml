name: TEST Bhoom TBC TV HLS sources

on:
  push:
    paths:
      - ".github/workflows/test-bhoom-tbc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test supplied TBC HLS sources
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://stream.iplive.xyz/smmedia/tbctv/index.m3u8"
            "https://stream.iplive.xyz/smmedia/tbctv/tracks-v1a1/mono.m3u8"
          )

          for url in "${urls[@]}"; do
            echo "========================================"
            echo "TESTING: $url"

            tmp="$(mktemp)"
            http_code="$(curl -L --retry 2 --connect-timeout 10 --max-time 30 \
              -A "Mozilla/5.0" \
              -sS -o "$tmp" -w "%{http_code}" "$url")"

            echo "HTTP STATUS: $http_code"
            echo "CONTENT TYPE: $(file -b --mime-type "$tmp")"
            echo "BYTES: $(wc -c < "$tmp")"

            if [[ "$http_code" != "200" ]]; then
              echo "TBC HLS TEST: FAIL - HTTP $http_code"
              cat "$tmp" | head -c 500 || true
              exit 1
            fi

            if ! grep -q '^#EXTM3U' "$tmp"; then
              echo "TBC HLS TEST: FAIL - response is not an M3U8 playlist"
              head -c 500 "$tmp" || true
              exit 1
            fi

            echo "M3U8 PLAYLIST: PASS"
            grep -E '^#EXT-X-(STREAM-INF|TARGETDURATION|MEDIA-SEQUENCE)|^https?://' "$tmp" | head -n 20 || true
            rm -f "$tmp"
          done

          echo "TBC TV HLS SOURCE TEST: PASS"
