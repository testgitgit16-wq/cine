name: Update Bhoom Tamil streams

on:
  workflow_dispatch:
    inputs:
      max_channels:
        description: "Number of channels to scan (0 = all)"
        required: false
        default: "0"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bhoom-tamil
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bhoom-automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        working-directory: bhoom-automation
        env:
          MAX_CHANNELS: ${{ github.event.inputs.max_channels || '0' }}
        run: python scraper.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhoom-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bhoom-tamil.json output/bhoom-tamil.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update Bhoom Tamil streams"
          git push
