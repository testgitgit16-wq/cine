name: Update Bhoom Tamil streams

on:
  workflow_dispatch:
    inputs:
      category_page_limit:
        description: "Category pages per section (1 = first page only, 0 = all)"
        required: false
        default: "0"
      max_channels:
        description: "Maximum channels to scan (5 for test, 0 = all)"
        required: false
        default: "5"
      category_section:
        description: "Section to scan: tamil, local, or all"
        required: false
        default: "all"
      start_combined:
        description: "Start Combined workflow after publish (1=yes, 0=no)"
        required: false
        default: "1"
      validate_streams:
        description: "Validate HLS/DASH/HTTP streams (1=yes, 0=no)"
        required: false
        default: "1"
      stability_seconds:
        description: "Seconds between manifest checks (0=off)"
        required: false
        default: "3"
      player_initial_wait_seconds:
        description: "Seconds to wait for the player to expose the stream"
        required: false
        default: "10"
      player_capture_wait_seconds:
        description: "Extra seconds to wait after playback is triggered"
        required: false
        default: "5"
      recapture_rounds:
        description: "Fresh player/source recapture rounds after expired or invalid streams"
        required: false
        default: "1"
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: tamil-chain
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bhoom-automation/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape and validate
        working-directory: bhoom-automation
        env:
          # 0 = all category pages. For a quick test, use 1.
          CATEGORY_PAGE_LIMIT: ${{ github.event.inputs.category_page_limit || '0' }}
          CATEGORY_SECTION: ${{ github.event.inputs.category_section || 'all' }}
          # Production mode: scan all discovered channels.
          MAX_CHANNELS: "0"
          VALIDATE_STREAMS: ${{ github.event.inputs.validate_streams || '1' }}
          STABILITY_SECONDS: ${{ github.event.inputs.stability_seconds || '3' }}
          PLAYER_INITIAL_WAIT_SECONDS: ${{ github.event.inputs.player_initial_wait_seconds || '10' }}
          PLAYER_CAPTURE_WAIT_SECONDS: ${{ github.event.inputs.player_capture_wait_seconds || '5' }}
          RECAPTURE_ROUNDS: ${{ github.event.inputs.recapture_rounds || '1' }}
          RECAPTURE_ON_FAILURES: "1"
          RETRY_COUNT: "3"
          PUBLISH_SENSITIVE_HEADERS: "0"
        run: python -c "import asyncio, scraper; asyncio.run(scraper.main())"

      - name: Build one-entry-per-channel M3U
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          data = json.loads(Path("output/bhoom-tamil.json").read_text(encoding="utf-8"))
          out = ["#EXTM3U"]
          
          for channel in data.get("channels", []):
              name = str(channel.get("name") or "").strip()
              streams = [s for s in channel.get("streams", []) if s.get("url")]
              if not name or not streams:
                  continue
          
              primary = streams[0]
              safe_name = name.replace('"', "'").replace(",", " - ")
              logo = str(channel.get("logo") or "").strip()
              attrs = f'tvg-name="{safe_name}" group-title="Tamil"'
              if logo:
                  attrs += f' tvg-logo="{logo.replace(chr(34), chr(39))}"'
          
              out.append(f"#EXTINF:-1 {attrs},{safe_name}")
              headers = primary.get("headers") or {}
              if headers.get("referer"):
                  out.append(f"#EXTVLCOPT:http-referrer={headers['referer']}")
              if headers.get("user-agent"):
                  out.append(f"#EXTVLCOPT:http-user-agent={headers['user-agent']}")
              out.append(primary["url"])
          
              # Keep alternate working URLs under this same channel as
              # comments. Standard M3U clients ignore these comments, while
              # our app can read them for automatic stream fallback.
              for alt in streams[1:]:
                  out.append(f"# X-ALT-STREAM: {alt['url']}")
                  alt_headers = alt.get("headers") or {}
                  if alt_headers.get("referer"):
                      out.append(f"# X-ALT-REFERRER: {alt_headers['referer']}")
                  if alt_headers.get("user-agent"):
                      out.append(f"# X-ALT-USER-AGENT: {alt_headers['user-agent']}")
          
              out.append("")
          
          Path("output/bhoom-tamil.m3u").write_text("\\n".join(out).rstrip() + "\\n", encoding="utf-8")
          print(f"Wrote {sum(1 for x in data.get('channels', []) if x.get('name') and x.get('streams'))} unique channel blocks")
          PY

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhoom-debug-${{ github.run_id }}
          path: |
            debug/
            output/bhoom-tamil-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Bhoom playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/bhoom-tamil.json output/bhoom-tamil.m3u
          if [ -f output/bhoom-tamil-report.json ]; then
            git add output/bhoom-tamil-report.json
          fi
          # BhoomTV stream URLs can rotate/expire. Always publish a fresh
          # scrape snapshot and force a commit marker even when the textual
          # channel list happens to be identical.
          sed -i '/^# BhoomTV scrape:/d' output/bhoom-tamil.m3u
          sed -i "2i# BhoomTV scrape: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" output/bhoom-tamil.m3u
          git add output/bhoom-tamil.m3u output/bhoom-tamil.json
          if [ -f output/bhoom-tamil-report.json ]; then
            git add output/bhoom-tamil-report.json
          fi
          git commit -m "chore: refresh Bhoom Tamil streams"
          # Rebase onto the newest main because other workflow/config commits
          # can arrive after this job checks out the repository.
          git fetch origin main
          git rebase origin/main
          git push

      - name: Start Combined workflow
        if: ${{ github.event.inputs.start_combined != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-amaze-tamil-local.yml --ref main
