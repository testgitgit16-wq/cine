name: Update Bhoom Tamil streams

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: github or windows-self-hosted"
        required: false
        default: "github"
      category_page_limit:
        description: "Category pages (0 = unlimited)"
        required: false
        default: "0"
      max_channels:
        description: "Maximum channels (0 = all)"
        required: false
        default: "0"
      category_section:
        description: "Section: all, tamil or local"
        required: false
        default: "all"
      validate_streams:
        description: "Validate HLS/DASH streams"
        required: false
        default: "1"
      stability_seconds:
        description: "Second HLS manifest check"
        required: false
        default: "3"
      player_capture_wait_seconds:
        description: "Browser capture wait"
        required: false
        default: "8"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bhoom-tamil
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ${{ github.event.inputs.runner == 'windows-self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bhoom-automation/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r bhoom-automation/requirements.txt

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright browser (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
        shell: pwsh

      - name: Probe alternate Bhoom domains
        run: |
          python - <<'PY'
          import urllib.request
          urls = [
              "https://bhoomtv.org/channel/tamil/",
              "https://bhoomtv.com/live/page/20/",
              "https://bhoomtv.net/",
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"PROBE {url} -> HTTP {r.status} FINAL {r.geturl()}")
              except Exception as e:
                  print(f"PROBE {url} -> ERROR {e}")
          PY

      - name: Inspect reachable BhoomTV.net API candidates
        run: |
          python - <<'PY'
          import urllib.request
          from urllib.parse import urljoin
          import re

          base = "https://bhoomtv.net/"
          req = urllib.request.Request(base, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              html = r.read().decode("utf-8", "ignore")
              print(f"NET ROOT HTTP {r.status} FINAL {r.geturl()} BYTES {len(html)}")

          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I):
              print("NET SCRIPT", urljoin(base, src))

          candidates = [
              "https://bhoomtv.net/api",
              "https://bhoomtv.net/api/channels",
              "https://bhoomtv.net/api/tv",
              "https://bhoomtv.net/channels",
              "https://bhoomtv.net/tv",
              "https://bhoomtv.net/channel/tamil/",
              "https://bhoomtv.net/live/",
          ]
          for url in candidates:
              try:
                  q = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/html,*/*"})
                  with urllib.request.urlopen(q, timeout=15) as r:
                      body = r.read(800).decode("utf-8", "ignore").replace("\n"," ")
                      print(f"NET CANDIDATE {url} -> HTTP {r.status} FINAL {r.geturl()} BODY {body[:220]}")
              except Exception as e:
                  print(f"NET CANDIDATE {url} -> ERROR {e}")
          PY

      - name: Run unit tests
        working-directory: bhoom-automation
        run: python -m unittest discover -s tests -v

      - name: Scrape
        working-directory: bhoom-automation
        env:
          CATEGORY_SECTION: ${{ github.event.inputs.category_section || 'all' }}
          BHOOM_PROXY_BASE_URL: "https://bhoom-tamil-api.testtamil.workers.dev"
          # Worker is the authorized BhoomTV source bridge
          CATEGORY_PAGE_LIMIT: ${{ github.event.inputs.category_page_limit || '0' }}
          MAX_CHANNELS: ${{ github.event.inputs.max_channels || '0' }}
          VALIDATE_STREAMS: ${{ github.event.inputs.validate_streams || '1' }}
          STABILITY_SECONDS: ${{ github.event.inputs.stability_seconds || '3' }}
          PLAYER_CAPTURE_WAIT_SECONDS: ${{ github.event.inputs.player_capture_wait_seconds || '8' }}
          SITEMAP_FALLBACK: "1"
          SITEMAP_MAX_CHANNEL_PAGES: "200"
          MAX_CAPTURE_CANDIDATES: "6"
        run: python -u scraper.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhoom-diagnostics-${{ github.run_id }}
          path: |
            output/bhoom-tamil-report.json
            debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output state
          if git diff --cached --quiet; then
            echo "No output/state changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Bhoom Tamil streams"
          git push
